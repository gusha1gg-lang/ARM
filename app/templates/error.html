{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — Справочник ТЭСК ТБД{% endblock %}

{% block content %}
<div class="card">
    <div class="card__head">Ошибка {{ code }}</div>
    <div class="card__body">
        <p>{{ message }}</p>
        <p>
            <a class="btn" href="{{ url_for('index') }}">На главную</a>
            {% if not g.user %}
            <a class="btn btn--primary" href="{{ url_for('auth.login') }}">Войти</a>
            {% endif %}
        </p>
    </div>
</div>
{% endblock %}
